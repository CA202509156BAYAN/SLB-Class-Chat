<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Chat</title>
    
    <!-- 1. SUPABASE CDN (Dapat nauuna ito para mabasa ang 'supabase') -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Pwede mong ilagay dito ang CSS stylesheet mo kung mayroon ka -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- AUTH SCREEN (Login / Sign Up) -->
    <div id="auth-screen">
        <h2>Class Chat Login</h2>
        <div id="auth-error" style="color: red; margin-bottom: 10px;"></div>
        <form id="auth-form">
            <input type="text" id="auth-name" placeholder="Display Name (para sa Sign Up)" /><br><br>
            <input type="email" id="auth-email" placeholder="Email" required /><br><br>
            <input type="password" id="auth-password" placeholder="Password" required /><br><br>
            
            <button type="button" id="signup-btn">Sign Up</button>
            <button type="submit" id="signin-btn">Sign In</button>
        </form>
    </div>

    <!-- CHAT SCREEN (Nakalabas pagka-login) -->
    <div id="chat-screen" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="user-display">Signed in as: User</span>
            <button id="logout-btn">Sign Out</button>
        </div>
        <hr>
        
        <div style="height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
            <ul id="messages" style="list-style: none; padding: 0; margin: 0;">
                <!-- Dito papasok ang messages -->
            </ul>
        </div>

        <form id="message-form">
            <input type="text" id="message-input" placeholder="Type a message or /weather City..." style="width: 75%;" required />
            <button type="submit" id="send-btn">Send</button>
        </form>
        <button id="clear-btn" style="margin-top: 10px;">Clear My Messages</button>
    </div>

    <!-- 2. ANG IYONG SCRIPT.JS (Dapat huli itong binabasa) -->
    <script src="Script.js"></script>
</body>
</html>
