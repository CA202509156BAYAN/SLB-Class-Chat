<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Chat</title>
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CSS stylesheet (I-link ang file o ilagay sa style.css) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- AUTH SCREEN (Login & Sign Up Card) -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <h2>Class Chat Login</h2>
            <p id="auth-error" class="error-text"></p>
            
            <form id="auth-form">
                <div>
                    <label for="auth-name">Display Name (for Sign Up)</label>
                    <input type="text" id="auth-name" placeholder="Your name" />
                </div>
                <div>
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" placeholder="name@example.com" required />
                </div>
                <div>
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required />
                </div>
                
                <div class="auth-actions">
                    <button type="button" id="signup-btn" class="ghost">Sign Up</button>
                    <button type="button" id="signin-btn">Sign In</button>
                </div>
            </form>
        </div>
    </div>

    <!-- CHAT SCREEN (Main Chat Window) -->
    <div id="chat-screen" class="chat hidden">
        <header class="chat-header">
            <h1>Class Chat</h1>
            <div class="controls">
                <span id="user-display">Signed in as: User</span>
                <button id="logout-btn" class="ghost">Sign Out</button>
            </div>
        </header>

        <ul id="messages" class="messages">
        </ul>

        <form id="message-form" class="composer">
            <input type="text" id="message-input" placeholder="Type a message or /weather City..." autocomplete="off" required />
            <button type="submit" id="send-btn">Send</button>
            <button type="button" id="clear-btn" class="ghost" title="Clear my messages">Clear</button>
        </form>
    </div>

    <script src="Script.js"></script>
</body>
</html>
